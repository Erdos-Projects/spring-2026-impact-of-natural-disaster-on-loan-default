[project]
name = "climatefinance"
version = "0.1.0"
description = "Library for analyzing the impact of natural disasters on loan defaults"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pyarrow>=23.0",
    "scikit-learn>=1.8",
    "sqlalchemy>=2.0",
    "xgboost>=3.2",
    "catboost>=1.2",
    "linearmodels>=7.0",
    "pmdarima>=2.1",
    "interpret-core[debug,linear,notebook,plotly,sensitivity,shap]>=0.7",
    "pandera>=0.29",
    "missingno>=0.5",
    "pygam>=0.12",
    "plotly>=6.0",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "ruff",
]
scraping = [
    "cinemagoer",
    "lxml",
    "pynytimes",
    "ucimlrepo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climatefinance"]

[tool.uv]
default-groups = ["dev"]
resolution = "highest"
# Override old numba/llvmlite versions that interpret pulls in
override-dependencies = [
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "shap>=0.45.0",
]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
