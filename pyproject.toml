[project]
name = "climatefinance"
version = "0.1.0"
description = "Library for analyzing the impact of natural disasters on loan defaults"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.0",
    "pandas>=2.0",
    "pyarrow",
    "scikit-learn>=1.4",
    "sqlalchemy",
    "xgboost==2.1.4",
    "catboost>=1.2",
    "linearmodels>=6.0",
    "pmdarima>=2.0",
    "interpret",
    "pandera",
    "missingno",
    "pygam",
    "plotly==5.24.0",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "jupyter",
    "ipykernel",
    "ruff",
]
scraping = [
    "cinemagoer",
    "lxml",
    "pynytimes",
    "ucimlrepo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climatefinance"]

[tool.uv]
default-groups = ["dev"]
resolution = "highest"
# Override old numba/llvmlite versions that interpret pulls in
override-dependencies = [
    "numba>=0.59.0",
    "llvmlite>=0.42.0",
    "shap>=0.45.0",
]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
